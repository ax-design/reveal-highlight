<!doctype html>
<html><head><meta charset="utf-8"><title>reveal-highlight browser test</title>
<style>
  body { margin: 0; padding: 40px; font: 14px sans-serif; }
  button { width: 120px; height: 40px; border: 0; background: transparent; display: block; }
  ax-reveal, ax-reveal-ng { --reveal-color: rgb(255, 0, 0); --reveal-opacity: 0.8; --reveal-border-width: 2px; }
  #bound { display: inline-block; padding: 0; }
  .round { --reveal-border-decoration-type: round; --reveal-border-decoration-radius: 6px; }
  @media (forced-colors: active) {
    .ax-reveal-button { border: 1px solid ButtonText; }
    .ax-reveal-button:hover, .ax-reveal-button:active { border-color: Highlight; }
  }
</style></head>
<body>
<ax-reveal-provider>
  <ax-reveal-bound id="bound">
    <ax-reveal id="r1" class="round"><button class="ax-reveal-button">one</button></ax-reveal>
    <ax-reveal id="r2" class="round" data-top-left-border-radius="16"><button class="ax-reveal-button">two</button></ax-reveal>
  </ax-reveal-bound>
</ax-reveal-provider>
<div style="height: 30px"></div>
<ax-reveal-bound><ax-reveal-ng id="ng" class="round"><button class="ax-reveal-button">ng</button></ax-reveal-ng></ax-reveal-bound>
<!-- Outside any boundary: a press from press() needs no pointer over the element. -->
<div style="height: 30px"></div>
<ax-reveal id="free" class="round"><button class="ax-reveal-button">free</button></ax-reveal>
<ax-reveal-ng id="free-ng" class="round"><button class="ax-reveal-button">free ng</button></ax-reveal-ng>
<!-- Motion checks: a 3D motion and a fade, drawn by the layers themselves. -->
<div id="motion" style="position: absolute; left: 400px; top: 40px; display: flex; gap: 40px; align-items: center;">
  <ax-reveal id="mo-r" class="round"><button class="ax-reveal-button">motion</button></ax-reveal>
  <ax-reveal-ng id="mo-ng" class="round"><button class="ax-reveal-button">motion</button></ax-reveal-ng>
</div>
<ax-surface id="surface" layers="reveal" style="display: block; width: 160px; height: 60px; margin-top: 20px;"></ax-surface>
<script type="module" src="./page.ts"></script>
</body></html>
